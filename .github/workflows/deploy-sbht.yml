name: Deploy sbht.thedesigndynasty.com

on:
  push:
    branches: ["main", "master"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Create .env.production
        run: |
          cat > .env.production << 'EOF'
          VITE_API_URL=${{ secrets.VITE_API_URL }}
          VITE_MAIL_API_URL=${{ secrets.VITE_MAIL_API_URL }}
          VITE_MAIL_FROM=${{ secrets.VITE_MAIL_FROM }}
          VITE_GDRIVE_KEY=${{ secrets.VITE_GDRIVE_KEY }}
          VITE_GDRIVE_FOLDER_ID=${{ secrets.VITE_GDRIVE_FOLDER_ID }}
          VITE_GDRIVE_FOLDER_ID_HERO=${{ secrets.VITE_GDRIVE_FOLDER_ID_HERO }}
          VITE_GDRIVE_FOLDER_ID_EVENTS=${{ secrets.VITE_GDRIVE_FOLDER_ID_EVENTS }}
          VITE_GDRIVE_FOLDER_ID_POSTERS=${{ secrets.VITE_GDRIVE_FOLDER_ID_POSTERS }}
          VITE_GOOGLE_CALENDAR_ID=${{ secrets.VITE_GOOGLE_CALENDAR_ID }}
          VITE_JOT_FORM_ID=${{ secrets.VITE_JOT_FORM_ID }}
          VITE_BOOKING_LINK=${{ secrets.VITE_BOOKING_LINK }}
          EOF

      - name: Build
        run: npm run build

      - name: Deploy dist to server
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avzr --delete
          path: dist/
          remote_path: ${{ secrets.SBHT_DEPLOY_PATH }}
          remote_host: ${{ secrets.SBHT_HOST }}
          remote_user: ${{ secrets.SBHT_USER }}
          remote_key: ${{ secrets.SBHT_SSH_KEY }}

