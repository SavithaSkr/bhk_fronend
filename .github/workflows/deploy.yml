name: Deploy Vite to VPS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build
        env:
          VITE_CALENDAR_ID: ${{ vars.VITE_CALENDAR_ID }}
        run: npm run build

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SBHT_SSH_KEY }}

      - name: Deploy to VPS
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" \
          dist/ ${{ secrets.SBHT_USER }}@${{ secrets.SBHT_HOST }}:/home/sbht/htdocs/sbht.thedesigndynasty.com/
