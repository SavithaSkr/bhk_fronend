name: Deploy Vite to VPS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build
        env:
          VITE_GOOGLE_CALENDAR_ID: ${{ secrets.VITE_GOOGLE_CALENDAR_ID }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_MAIL_API_URL: ${{ secrets.VITE_MAIL_API_URL }}
          VITE_MAIL_FROM: ${{ secrets.VITE_MAIL_FROM }}
          VITE_MAIL_API_KEY: ${{ secrets.VITE_MAIL_API_KEY }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
        run: npm run build

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SBHT_SSH_KEY }}

      - name: Add host to known_hosts (best effort)
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -T 10 -H "${{ secrets.SBHT_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "known_hosts updated (or skipped)"

      - name: Ensure web root exists on VPS
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.SBHT_USER }}@${{ secrets.SBHT_HOST }}" "mkdir -p '${{ secrets.SBHT_DEPLOY_PATH }}'"

      - name: Deploy dist to VPS (protect /api)
        run: |
          rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=no" \
            --exclude="api/" \
            dist/ \
            "${{ secrets.SBHT_USER }}@${{ secrets.SBHT_HOST }}:${{ secrets.SBHT_DEPLOY_PATH }}/"

      - name: Verify deployment
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.SBHT_USER }}@${{ secrets.SBHT_HOST }}" "ls -la '${{ secrets.SBHT_DEPLOY_PATH }}' | head -n 60"
